name: Django CI Pipeline

on:
  push:
    branches: ["main", "Develop"]
  pull_request:
    branches: ["main", "Develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Levantar la arquitectura con Docker Compose
        run: docker compose up -d --build

      - name: Esperar inicialización de servicios y migraciones
        run: sleep 5

      - name: Ejecutar pruebas de Django
        run: docker compose exec -T web python manage.py test

      - name: Mostrar logs de Docker si hubo algún error
        if: failure()
        run: docker compose logs

      - name: Detener contenedores
        if: always()
        run: docker compose down -v
