{% extends 'base-feed-mobile.html' %}
{% load static i18n %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/add-pet.css' %}" />

<div class="add-pet-container">
    <a href="javascript:history.back()" class="btn-back" aria-label="{% translate 'Volver' %}">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </a>
    <div class="add-pet-header">
        <div class="logo-circle">
            <img src="{% static 'img/logo.jpeg' %}" alt="Match Pets" />
        </div>
    </div>

    <div class="card-add-pet">
        <h1 class="card-title">{% translate "Agregar Mascota" %}</h1>

        <form class="form-add-pet" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="field-group">
                <label for="name">{% translate "Nombre" %}</label>
                <input type="text" id="name" name="name" placeholder="{% translate 'Nombre' %}" autocomplete="off" required />
            </div>

            <div class="field-group">
                <label for="gender">{% translate "Sexo" %}</label>
                <input type="text" id="gender" name="gender" placeholder="{% translate 'ej: macho' %}" autocomplete="off" required />
            </div>

            <div class="field-group">
                <label for="temperament">{% translate "Temperamento" %}</label>
                <input type="text" id="temperament" name="temperament" placeholder="{% translate 'ej: alegre' %}" autocomplete="off" required />
            </div>

            <div class="field-group">
                <label for="species">{% translate "Especie" %}</label>
                <input type="text" id="species" name="species" placeholder="{% translate 'ej: perro' %}" autocomplete="off" required />
            </div>

            <div class="field-group">
                <label for="age">{% translate "Edad" %}</label>
                <div class="date-input-wrapper">
                    <input type="text" id="age" name="age" placeholder="dd/mm/yyyy" autocomplete="off" required />
                    <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" stroke="#f97206" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
            </div>

            <div class="photo-group">
                <label class="btn-photo" for="pet-photo">
                    <svg class="clip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                    </svg>
                    <span id="photo-label-text">{% translate "Agregar foto" %}</span>
                </label>
                <input type="file" id="pet-photo" name="pet_photo" accept="image/*" style="display: none;"
                    onchange="if(this.files[0]) document.getElementById('photo-label-text').textContent = this.files[0].name;" />
            </div>

            <div class="btn-submit-wrapper">
                <button type="submit" class="btn-submit">{% translate "Agregar" %}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
