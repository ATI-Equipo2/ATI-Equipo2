{% extends 'base-registro-iniciarSesion-aggMascota.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/signup.css' %}" />

<form class="form-signup" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="field-group">
        <label for="first-name">Nombre</label>
        <input type="text" id="first-name" name="first_name" placeholder="Nombre" required />
    </div>

    <div class="field-group">
        <label for="last-name">Apellido</label>
        <input type="text" id="last-name" name="last_name" placeholder="Apellido" required />
    </div>

    <div class="field-group">
        <label for="id-card">Cédula</label>
        <input type="text" id="id-card" name="id_card" placeholder="V-123456789" required />
    </div>

    <div class="field-group">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" placeholder="ej: nombre@gmail.com" required />
    </div>

    <div class="field-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="**********" required />
    </div>

    <div class="field-group">
        <label for="birthdate">Fecha</label>
        <div class="date-wrapper">
            <input type="date" id="birthdate" name="birthdate" required />
        </div>
    </div>

    <div class="field-group">
        <label for="gender">Género</label>
        <div class="select-wrapper">
            <select id="gender" name="gender" required>
                <option value="" disabled selected hidden>Género</option>
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
                <option value="O">Otro</option>
            </select>
        </div>
    </div>

    <div class="field-group">
        <label for="profile-picture">Foto de perfil</label>
        <label class="btn-photo" for="profile-picture">
            <svg
                class="clip-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <path
                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
            </svg>
            <span id="photo-label-text" class="btn-text-photo">Agregar foto</span>
        </label>
        <input
            type="file"
            id="profile-picture"
            name="profile_picture"
            accept="image/*"
            style="display: none" />
    </div>

    <div class="btn-submit-wrapper">
        <button type="submit" class="btn-signup">Crear Cuenta</button>
    </div>
</form>
{% endblock %}
