{% extends 'base-registro-iniciarSesion-aggMascota.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/inicio_sesion.css' %}" />

<form class="form-inicio_sesion" method="POST">
    {% csrf_token %}
    <div class="campo-grupo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" placeholder="ej: nombre@gmail.com" required />
    </div>

    <div class="campo-grupo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="**********" required />
    </div>

    <div class="btn-submit-wrapper">
        <button type="submit" class="btn-iniciar-sesion">Iniciar Sesión</button>
    </div>

    <div class="enlaces-auth">
        <a href="#" class="enlace-auth">¿Olvidaste tu contraseña?</a>
        <a href="{% url 'registro' %}" class="enlace-auth">No tienes cuenta? Regístrate</a>
    </div>
</form>
{% endblock %}
