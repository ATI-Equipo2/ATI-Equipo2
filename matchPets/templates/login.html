{% extends 'base-registro-iniciarSesion-aggMascota.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/login.css' %}" />

<form class="form-login" method="POST">
    {% csrf_token %}
    <div class="field-group">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" placeholder="ej: nombre@gmail.com" required />
    </div>

    <div class="field-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="**********" required />
    </div>

    <div class="btn-submit-wrapper">
        <button type="submit" class="btn-login">Iniciar Sesión</button>
    </div>

    <div class="auth-links">
        <a href="#" class="auth-link">¿Olvidaste tu contraseña?</a>
        <a href="{% url 'registro' %}" class="auth-link">No tienes cuenta? Regístrate</a>
    </div>
</form>
{% endblock %}
