{% extends 'base-registro-iniciarSesion-aggMascota.html' %}
{% load static i18n %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/login.css' %}" />

<form class="form-login" method="POST">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}" />
    {% for error in form.non_field_errors %}<p class="form-errors">{{ error }}</p>{% endfor %}

    <div class="field-group">
        <label for="username">{% translate "Usuario" %}</label>
        <input type="text" id="username" name="username" value="{{ form.username.value|default:'' }}"
            placeholder="{% translate 'Usuario' %}" autocomplete="username" required />
    </div>

    <div class="field-group">
        <label for="password">{% translate "Contraseña" %}</label>
        <input type="password" id="password" name="password" placeholder="**********" autocomplete="current-password"
            required />
    </div>

    <div class="btn-submit-wrapper">
        <button type="submit" class="btn-login">{% translate "Iniciar Sesión" %}</button>
    </div>

    <div class="auth-links">
        <a href="#" class="auth-link">{% translate "¿Olvidaste tu contraseña?" %}</a>
        <a href="{% url 'registro' %}" class="auth-link">{% translate "¿No tienes una cuenta? Regístrate" %}</a>
    </div>
</form>
{% endblock %}r
