{% extends 'base-registro-iniciarSesion-aggMascota.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/registro.css' %}" />

<form class="form-registro" method="POST" enctype="multipart/form-data">
    <div class="campo-grupo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre" required />
    </div>

    <div class="campo-grupo">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" placeholder="Apellido" required />
    </div>

    <div class="campo-grupo">
        <label for="cedula">Cédula</label>
        <input type="text" id="cedula" name="cedula" placeholder="V-123456789" required />
    </div>

    <div class="campo-grupo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" placeholder="ej: nombre@gmail.com" required />
    </div>

    <div class="campo-grupo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="**********" required />
    </div>

    <div class="campo-grupo">
        <label for="fecha">Fecha</label>
        <div class="fecha-wrapper">
            <input type="date" id="fecha" name="fecha" required />
        </div>
    </div>

    <div class="campo-grupo">
        <label for="genero">Género</label>
        <div class="select-wrapper">
            <select id="genero" name="genero" required>
                <option value="" disabled selected hidden>Género</option>
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
                <option value="O">Otro</option>
            </select>
        </div>
    </div>

    <div class="campo-grupo">
        <label for="foto">Foto de perfil</label>
        <label class="btn-foto" for="foto">
            <svg class="clip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
            </svg>
            <span id="foto-label-text">Agregar foto</span>
        </label>
        <input type="file" id="foto" name="foto" accept="image/*" style="display: none" />
    </div>

    <div class="btn-submit-wrapper">
        <button type="submit" class="btn-crear-cuenta">Crear Cuenta</button>
    </div>
</form>
{% endblock %}
